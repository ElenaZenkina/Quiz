<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Китайский язык: ключи</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <nav class="menu">
    <button id="menu-theory" class="active">Теория</button>
    <button id="menu-quiz">Тест</button>
  </nav>

  <main>
    <section id="theory">
      <h1>Теория</h1>
      <ul class="theory-list">
        <li><span class="key">女</span>——妈、姐、妹、姥、奶、她</li>
        <li><span class="key">饣</span>——饭、饿、饺、饱</li>
        <li><span class="key">讠</span>——说、讲、话、课、谢</li>
        <li><span class="key">艹</span>——花、菜、草、茶</li>
        <li><span class="key">犭</span>——狗、猫、狼、狐狸、狮、猴</li>
      </ul>
    </section>

    <section id="quiz" hidden>
      <div id="question-nav" class="question-nav"></div>
      <div id="quiz-body"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
